name: stegflow

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-steg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-steg_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-stegflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-steg} -d ${POSTGRES_DB:-stegflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-stegflow}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-stegflow_dev_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-stegflow} ${S3_SECRET_KEY:-stegflow_dev_secret};
      mc mb --ignore-existing local/${S3_BUCKET:-stegflow-media};
      exit 0;"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-steg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-steg_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-stegflow}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-stegflow-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-stegflow}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-stegflow_dev_secret}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-cloudinary}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-roarxt0j}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-879564454732789}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-5aCnzAoGCTPGoPQAMY6sEr65k8Y}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-cloudinary://879564454732789:5aCnzAoGCTPGoPQAMY6sEr65k8Y@roarxt0j}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-stegflow-local-access-secret-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-stegflow-local-refresh-secret-change-in-production}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-604800}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP_NAME: admin
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped

  citizen:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP_NAME: citizen
    ports:
      - "4201:80"
    depends_on:
      - api
    restart: unless-stopped

  maintenance:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP_NAME: maintenance
    ports:
      - "4202:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
