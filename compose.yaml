name: stegflow

services:
  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP_NAME: admin
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped

  citizen:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP_NAME: citizen
    ports:
      - "4201:80"
    depends_on:
      - api
    restart: unless-stopped

  maintenance:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP_NAME: maintenance
    ports:
      - "4202:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
